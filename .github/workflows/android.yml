name: Android

# Gera o APK assinado. Chamado pelo deploy (link no site) e pelo release (tags v*).
on:
  workflow_call:
    inputs:
      version_name:
        type: string
        required: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      - run: npm ci
      - run: npm run build
      - run: npx cap sync android

      - name: Build signed APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_PATH"
          # Minutos desde a época: cresce sempre, entre execuções de qualquer workflow.
          export ANDROID_VERSION_CODE=$(( $(date +%s) / 60 ))
          export ANDROID_VERSION_NAME="${VERSION_NAME:-$(node -p "require('../package.json').version")-${GITHUB_SHA::7}}"
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          rm -f "$ANDROID_KEYSTORE_PATH"

      - name: Verify signature
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          "$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner" verify --print-certs "$APK" | head -3
          mkdir -p out && cp "$APK" out/figurinhas.apk

      - uses: actions/upload-artifact@v7
        with:
          name: figurinhas-apk
          path: out/figurinhas.apk
          if-no-files-found: error
